<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - عطور الفخامة</title>
    <link rel="stylesheet" href="admin-style.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="dashboard-container">

    <!-- 1️⃣ قسم رقم الواتساب الخاص بالاستلام -->
    <div class="card">
        <div class="card-title">📱 رقم الواتساب الخاص بالاستلام</div>
        <form id="whatsapp-form" onsubmit="saveWhatsappNumber(event)">
            <div class="form-group">
                <!-- تم تعديل الـ placeholder ليظهر كرمز إرشادي وليس رقم حقيقي -->
                <input type="tel" id="whatsapp-input" placeholder="مثال: 213XXXXXXXXX" autocomplete="off" required>
            </div>
            <button type="submit" class="btn-primary">حفظ الرقم</button>
        </form>
    </div>

    <!-- 2️⃣ قسم إضافة عطر جديد للمتجر -->
    <div class="card">
        <div class="card-title">➕ إضافة عطر جديد للمتجر</div>
        <form id="add-product-form" onsubmit="handleAddProduct(event)">
            
            <div class="form-group">
                <!-- إلغاء اقتراح الأسماء القديمة تلقائياً -->
                <input type="text" id="p-name" placeholder="اسم العطر" autocomplete="off" required>
            </div>

            <div class="form-group">
                <input type="number" id="p-price" placeholder="السعر (د.ج)" autocomplete="off" required>
            </div>

            <!-- إضافة حقل الكمية المتوفرة -->
            <div class="form-group">
                <input type="number" id="p-stock" placeholder="الكمية المتوفرة في المخزن (مثال: 10)" autocomplete="off" min="1" required>
            </div>

            <div class="form-group">
                <label>التصنيف:</label>
                <select id="p-category">
                    <option value="عطور صيفية">عطور صيفية</option>
                    <option value="عطور رجالية">عطور رجالية</option>
                    <option value="عطور نسائية">عطور نسائية</option>
                    <option value="عطور للمناسبات">عطور للمناسبات</option>
                    <option value="الأكثر مبيعاً">الأكثر مبيعاً</option>
                </select>
            </div>

            <div class="form-group">
                <label>اختر صور العطر من المعرض (3 صور كحد أقصى):</label>
                <input type="file" id="p-images" multiple accept="image/*" class="file-input">
            </div>

            <div class="form-group">
                <textarea id="p-desc" rows="3" placeholder="وصف العطر" autocomplete="off"></textarea>
            </div>

            <button type="submit" class="btn-primary">نشر المنتج في المتجر</button>
        </form>
    </div>

</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyC3Y1n6gd-XtJdv-7UKOesb9-Lgc2lII0c",
      authDomain: "otour-elfakhama-cf76d.firebaseapp.com",
      projectId: "otour-elfakhama-cf76d",
      storageBucket: "otour-elfakhama-cf76d.firebasestorage.app",
      messagingSenderId: "843441752510",
      appId: "1:843441752510:web:94b201def5ea9510c491ef",
      databaseURL: "https://otour-elfakhama-cf76d-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function saveWhatsappNumber(e) {
        e.preventDefault();
        const num = document.getElementById('whatsapp-input').value.trim();
        if (num) {
            db.ref("settings/config/whatsapp").set(num).then(() => {
                alert("تم حفظ رقم الواتساب بنجاح!");
            });
        }
    }

    async function handleAddProduct(e) {
        e.preventDefault();
        const name = document.getElementById('p-name').value.trim();
        const price = parseFloat(document.getElementById('p-price').value);
        const stock = parseInt(document.getElementById('p-stock').value);
        const category = document.getElementById('p-category').value;
        const desc = document.getElementById('p-desc').value.trim();
        const files = document.getElementById('p-images').files;

        let imageUrls = [];
        for (let i = 0; i < Math.min(files.length, 3); i++) {
            const base64 = await convertBase64(files[i]);
            imageUrls.push(base64);
        }

        db.ref("products").push({
            name: name,
            price: price,
            stock: stock,
            category: category,
            desc: desc,
            images: imageUrls,
            createdAt: Date.now()
        }).then(() => {
            alert("تم نشر العطر بنجاح!");
            document.getElementById('add-product-form').reset();
        });
    }

    function convertBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - عطور الفخامة</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #d4af37;
            --text-color: #f8fafc;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --btn-blue: #0284c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        /* شريط التثبيت */
        .install-banner {
            display: none;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid var(--accent-gold);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            align-items: center;
            justify-content: space-between;
        }
        .install-banner.show { display: flex; }
        .install-btn { background: var(--accent-gold); color: #000; border: none; padding: 6px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .close-banner { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; }

        .container { max-width: 800px; margin: 0 auto; }
        
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h2, h3 { margin-top: 0; color: #fff; }
        
        label { display: block; margin-top: 10px; font-size: 0.9rem; color: #cbd5e1; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }

        button.btn-primary {
            background: var(--btn-blue);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        /* جعل العرض والتمرير رأسياً من الأعلى للأسباب الراحة */
        .vertical-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .list-item-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }

        .item-body {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .item-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-sm {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-print { background: #3b82f6; color: white; }
        .btn-delete { background: var(--danger-color); color: white; }

        /* نافذة الطباعة (الفاتورة) */
        @media print {
            body * { visibility: hidden; }
            #printable-facture, #printable-facture * { visibility: visible; }
            #printable-facture { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; padding: 20px; }
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-body {
            background: #ffffff; color: #000; width: 90%; max-width: 500px; padding: 20px; border-radius: 12px;
        }
    </style>
</head>
<body>

    <!-- شريط التثبيت PWA -->
    <div id="pwa-banner" class="install-banner">
        <span>📲 تثبيت اللوحة كتطبيق على الشاشة؟</span>
        <div>
            <button class="install-btn" onclick="installPWA()">تنزيل</button>
            <button class="close-banner" onclick="hidePWABanner()">✕</button>
        </div>
    </div>

    <div class="container">
        <!-- إضافة منتج جديد -->
        <div class="card">
            <h3>➕ إضافة عطر جديد للمتجر</h3>
            <form id="add-product-form" onsubmit="saveProduct(event)">
                <label>اسم العطر:</label>
                <input type="text" id="prod-name" required placeholder="اسم العطر">
                
                <label>السعر (د.ج):</label>
                <input type="number" id="prod-price" required placeholder="مثال: 4500">
                
                <label>التصنيف:</label>
                <select id="prod-category">
                    <option value="عطور صيفية">عطور صيفية</option>
                    <option value="عطور رجالية">عطور رجالية</option>
                    <option value="عطور نسائية">عطور نسائية</option>
                    <option value="عطور للمناسبات">عطور للمناسبات</option>
                    <option value="الأكثر مبيعاً">الأكثر مبيعاً</option>
                </select>

                <label>صورة العطر:</label>
                <input type="file" id="prod-img" accept="image/*" required>

                <button type="submit" class="btn-primary">نشر المنتج في المتجر</button>
            </form>
        </div>

        <!-- قائمة المنتجات الحالية (تمرير رأسي من الأعلى) -->
        <div class="card">
            <h3>📦 المنتجات الحالية</h3>
            <div id="products-list" class="vertical-list">
                <p style="color:#94a3b8;">جاري تحميل المنتجات...</p>
            </div>
        </div>

        <!-- قائمة الطلبات المسجلة (تمرير رأسي من الأعلى) -->
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>🛍️ الطلبات المسجلة</h3>
                <button class="btn-sm btn-delete" onclick="deleteAllOrders()">حذف جميع الطلبات 🗑️</button>
            </div>
            <div id="orders-list" class="vertical-list">
                <p style="color:#94a3b8;">جاري تحميل الطلبات...</p>
            </div>
        </div>
    </div>

    <!-- نافذة معاينة وطباعة الفاتورة -->
    <div id="facture-modal" class="modal-overlay">
        <div class="modal-body">
            <div id="printable-facture">
                <div style="text-align:center; border-bottom:2px solid #000; padding-bottom:10px;">
                    <h2 style="margin:0; color:#000;">عطور الفخامة</h2>
                    <p style="margin:4px 0; font-size:0.9rem;">وصل طلب / Facture de commande</p>
                    <small id="facture-date"></small>
                </div>
                <div style="margin:15px 0; font-size:0.95rem;" id="facture-client-info"></div>
                <table style="width:100%; border-collapse:collapse; margin-top:10px; font-size:0.9rem;" border="1">
                    <thead>
                        <tr style="background:#f2f2f2;">
                            <th style="padding:6px;">المنتج</th>
                            <th style="padding:6px;">الكمية</th>
                            <th style="padding:6px;">السعر</th>
                        </tr>
                    </thead>
                    <tbody id="facture-items"></tbody>
                </table>
                <h3 style="text-align:left; margin-top:15px; color:#000;">الإجمالي: <span id="facture-total"></span> د.ج</h3>
            </div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn-primary" style="margin:0;" onclick="window.print()">🖨️ طباعة الفاتورة</button>
                <button class="btn-sm btn-delete" style="flex:1;" onclick="closeFactureModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        // تهيئة Firebase (المفاتيح الخاصة بك)
        const firebaseConfig = {
            databaseURL: "https://otour-elfakhama-cf76d-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // PWA Banner Logic
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-banner').classList.add('show');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    document.getElementById('pwa-banner').classList.remove('show');
                });
            }
        }
        function hidePWABanner() {
            document.getElementById('pwa-banner').classList.remove('show');
        }

        // ضغط الصورة تلقائياً لتسريع التحميل لثانيتين
        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > 400) { h = Math.round((h * 400) / w); w = 400; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        // إضافة منتج
        async function saveProduct(e) {
            e.preventDefault();
            const file = document.getElementById('prod-img').files[0];
            if (!file) return;

            const imgBase64 = await compressImage(file);
            await db.ref("products").push({
                name: document.getElementById('prod-name').value,
                price: document.getElementById('prod-price').value,
                category: document.getElementById('prod-category').value,
                image: imgBase64
            });

            alert("تم إدراج العطر بنجاح!");
            document.getElementById('add-product-form').reset();
        }

        // جلب البيانات وعرضها رأسياً
        db.ref("products").on('value', snap => {
            const container = document.getElementById('products-list');
            container.innerHTML = "";
            snap.forEach(child => {
                const p = child.val();
                container.innerHTML += `
                    <div class="list-item-card">
                        <div class="item-header">
                            <b>${p.name}</b>
                            <span style="color:var(--accent-gold); font-weight:bold;">${p.price} د.ج</span>
                        </div>
                        <div class="item-body">التصنيف: ${p.category || 'عام'}</div>
                        <div class="item-actions">
                            <button class="btn-sm btn-delete" onclick="deleteProduct('${child.key}')">حذف المنتج</button>
                        </div>
                    </div>`;
            });
        });

        let currentOrders = {};
        db.ref("orders").on('value', snap => {
            const container = document.getElementById('orders-list');
            container.innerHTML = "";
            currentOrders = snap.val() || {};
            
            snap.forEach(child => {
                const o = child.val();
                const key = child.key;
                
                let itemsSummary = "";
                if(o.items) {
                    itemsSummary = o.items.map(i => `${i.name} (${i.qty})`).join(', ');
                }

                container.innerHTML += `
                    <div class="list-item-card">
                        <div class="item-header">
                            <b>الزبون: ${o.customerName || 'غير معروف'}</b>
                            <span style="color:var(--accent-gold);">${o.total} د.ج</span>
                        </div>
                        <div class="item-body">
                            📞 الهاتف: ${o.phone || '-'}<br>
                            📍 العنوان: ${o.state || ''} - ${o.address || ''}<br>
                            🛍️ الطلب: ${itemsSummary}
                        </div>
                        <div class="item-actions">
                            <button class="btn-sm btn-print" onclick="openFacture('${key}')">🖨️ طباعة وصل</button>
                            <button class="btn-sm btn-delete" onclick="deleteOrder('${key}')">حذف</button>
                        </div>
                    </div>`;
            });
        });

        // إدراج وحذف
        function deleteProduct(key) { if(confirm("حذف المنتج؟")) db.ref("products/"+key).remove(); }
        function deleteOrder(key) { if(confirm("حذف الطلب؟")) db.ref("orders/"+key).remove(); }
        function deleteAllOrders() { if(confirm("هل تريد مسح كافة الطلبات؟")) db.ref("orders").remove(); }

        // فتح وتجهيز الفاتورة للطباعة
        function openFacture(orderKey) {
            const order = currentOrders[orderKey];
            if(!order) return;

            document.getElementById('facture-date').innerText = "التاريخ: " + new Date().toLocaleDateString('ar-DZ');
            document.getElementById('facture-client-info').innerHTML = `
                <b>اسم الزبون:</b> ${order.customerName || '-'}<br>
                <b>رقم الهاتف:</b> ${order.phone || '-'}<br>
                <b>العنوان/الولاية:</b> ${order.state || ''} - ${order.address || ''}
            `;

            let tbody = "";
            if(order.items) {
                order.items.forEach(item => {
                    tbody += `<tr>
                        <td style="padding:6px;">${item.name}</td>
                        <td style="padding:6px; text-align:center;">${item.qty}</td>
                        <td style="padding:6px; text-align:center;">${item.price} د.ج</td>
                    </tr>`;
                });
            }
            document.getElementById('facture-items').innerHTML = tbody;
            document.getElementById('facture-total').innerText = order.total || 0;
            document.getElementById('facture-modal').style.display = "flex";
        }

        function closeFactureModal() {
            document.getElementById('facture-modal').style.display = "none";
        }
    </script>
</body>
</html>

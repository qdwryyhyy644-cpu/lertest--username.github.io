<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المتجر - عطور الفخامة</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        input, select, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { background: #0284c7; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #0369a1; }
        .btn-danger { background: #e11d48; }
        .btn-danger:hover { background: #be123c; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: right; }
        th { background: #0f172a; }
        .img-preview-container { display: flex; gap: 10px; margin: 10px 0; }
        .img-preview { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #d4af37; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="login-screen" class="card" style="max-width:400px; margin: 50px auto; text-align: center;">
        <h2>🔐 تسجيل الدخول للوحة التحكم</h2>
        <input type="password" id="admin-pass" placeholder="أدخل كلمة السر">
        <button onclick="checkPassword()">دخول</button>
        <p id="login-error" style="color:#f43f5e;" class="hidden">كلمة السر غير صحيحة!</p>
    </div>

    <!-- 2. محتوى لوحة التحكم -->
    <div id="dashboard-screen" class="hidden">
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>👑 لوحة إدارة المتجر</h1>
            <button onclick="logout()" style="width: auto; padding: 8px 15px;" class="btn-danger">خروج</button>
        </div>

        <!-- 🔑 إعدادات تغيير كلمة السر -->
        <div class="card">
            <h3>🔑 تغيير كلمة سر اللوحة</h3>
            <input type="password" id="new-pass" placeholder="كلمة السر الجديدة">
            <button onclick="changePassword()" style="background: #d4af37; color: #000;">تحديث كلمة السر</button>
        </div>

        <!-- 📱 إعدادات رقم الواتساب -->
        <div class="card">
            <h3>📱 رقم الواتساب الخاص بالاستلام</h3>
            <input type="text" id="whatsapp-num" placeholder="مثال: 213656708603">
            <button onclick="saveWhatsapp()">حفظ الرقم</button>
        </div>

        <!-- ➕ إضافة منتج جديد -->
        <div class="card">
            <h3>➕ إضافة عطر جديد للمتجر</h3>
            <input type="text" id="p-name" placeholder="اسم العطر">
            <input type="number" id="p-price" placeholder="السعر (د.ج)">
            
            <label style="font-size: 0.9rem; color: #cbd5e1;">التصنيف:</label>
            <select id="p-category">
                <option value="عطور صيفية">عطور صيفية</option>
                <option value="عطور رجالية">عطور رجالية</option>
                <option value="عطور نسائية">عطور نسائية</option>
                <option value="عطور للمناسبات">عطور للمناسبات</option>
                <option value="الأكثر مبيعاً">الأكثر مبيعاً</option>
            </select>

            <label style="font-size: 0.9rem; color: #cbd5e1;">اختر صور العطر من المعرض (3 صور كحد أقصى):</label>
            <input type="file" id="p-files" accept="image/*" multiple onchange="previewImages(event)">
            <div class="img-preview-container" id="preview-box"></div>

            <textarea id="p-desc" placeholder="وصف العطر"></textarea>
            <button onclick="addProduct()">نشر المنتج في المتجر</button>
        </div>

        <!-- 📦 إدارة المنتجات الحالية -->
        <div class="card">
            <h3>📦 المنتجات الحالية</h3>
            <div id="products-list">تحميل المنتجات...</div>
        </div>

        <!-- 🛍️ قائمة الطلبات -->
        <div class="card">
            <h3>🛍️ الطلبات المسجلة</h3>
            <div id="orders-list">تحميل الطلبات...</div>
        </div>

    </div>

</div>

<script>
// ⚠️ ضع مفاتيح Firebase الخاصة بك هنا
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let base64Images = [];

// التحقق من كلمة السر من قواعد البيانات (مع افتراض "admin" لأول مرة)
async function checkPassword() {
    const inputPass = document.getElementById('admin-pass').value;
    const doc = await db.collection("settings").doc("security").get();
    
    let currentPass = "admin";
    if (doc.exists && doc.data().password) {
        currentPass = doc.data().password;
    }

    if (inputPass === currentPass) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
        loadDashboardData();
    } else {
        document.getElementById('login-error').classList.remove('hidden');
    }
}

async function changePassword() {
    const newPass = document.getElementById('new-pass').value;
    if (!newPass) { alert("يرجى كتابة كلمة السر الجديدة!"); return; }

    await db.collection("settings").doc("security").set({ password: newPass }, { merge: true });
    alert("تم تغيير كلمة السر بنجاح! استخدم كلمة السر الجديدة في المرة القادمة.");
    document.getElementById('new-pass').value = '';
}

function logout() {
    location.reload();
}

// معاينة وتحويل الصور المرفوعة من المعرض
function previewImages(event) {
    const files = Array.from(event.target.files);
    if (files.length > 3) {
        alert("يمكنك اختيار 3 صور كحد أقصى فقط!");
        event.target.value = "";
        return;
    }

    base64Images = [];
    const box = document.getElementById('preview-box');
    box.innerHTML = '';

    files.slice(0, 3).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
            base64Images.push(e.target.result);
            const img = document.createElement('img');
            img.src = e.target.result;
            img.className = 'img-preview';
            box.appendChild(img);
        };
        reader.readAsDataURL(file);
    });
}

async function loadDashboardData() {
    // جلب الواتساب
    const configDoc = await db.collection("settings").doc("config").get();
    if (configDoc.exists && configDoc.data().whatsapp) {
        document.getElementById('whatsapp-num').value = configDoc.data().whatsapp;
    }

    // جلب المنتجات
    db.collection("products").onSnapshot(snapshot => {
        let html = '<table><tr><th>الصورة</th><th>الاسم</th><th>التصنيف</th><th>السعر</th><th>إجراء</th></tr>';
        snapshot.forEach(doc => {
            const p = doc.data();
            const img = (p.images && p.images.length > 0) ? p.images[0] : '';
            html += `<tr>
                <td><img src="${img}" width="40" height="40" style="object-fit:cover; border-radius:4px;"></td>
                <td>${p.name}</td>
                <td><small>${p.category || 'عام'}</small></td>
                <td>${p.price} د.ج</td>
                <td><button class="btn-danger" onclick="deleteProduct('${doc.id}')">حذف</button></td>
            </tr>`;
        });
        html += '</table>';
        document.getElementById('products-list').innerHTML = html;
    });

    // جلب الطلبات
    db.collection("orders").orderBy("createdAt", "desc").onSnapshot(snapshot => {
        let html = '<table><tr><th>الزبون</th><th>الهاتف</th><th>المجموع</th><th>التاريخ</th></tr>';
        snapshot.forEach(doc => {
            const o = doc.data();
            const date = o.createdAt ? new Date(o.createdAt.toDate()).toLocaleString('ar-DZ') : 'الآن';
            html += `<tr>
                <td>${o.customerName || 'زبون'}</td>
                <td>${o.phone || '-'}</td>
                <td>${o.total} د.ج</td>
                <td><small>${date}</small></td>
            </tr>`;
        });
        html += '</table>';
        document.getElementById('orders-list').innerHTML = html;
    });
}

async function saveWhatsapp() {
    const num = document.getElementById('whatsapp-num').value;
    await db.collection("settings").doc("config").set({ whatsapp: num }, { merge: true });
    alert("تم حفظ رقم الواتساب بنجاح!");
}

async function addProduct() {
    const name = document.getElementById('p-name').value;
    const price = Number(document.getElementById('p-price').value);
    const category = document.getElementById('p-category').value;
    const desc = document.getElementById('p-desc').value;

    if (!name || !price) { alert("يرجى ملء الاسم والسعر!"); return; }
    if (base64Images.length === 0) { alert("يرجى اختيار صورة واحدة على الأقل من المعرض!"); return; }

    await db.collection("products").add({
        name: name,
        price: price,
        category: category,
        images: base64Images,
        desc: desc,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById('p-name').value = '';
    document.getElementById('p-price').value = '';
    document.getElementById('p-desc').value = '';
    document.getElementById('p-files').value = '';
    document.getElementById('preview-box').innerHTML = '';
    base64Images = [];
    alert("تمت إضافة العطر بنجاح للمتجر!");
}

async function deleteProduct(id) {
    if (confirm("هل أنت تأكد من حذف هذا المنتج؟")) {
        await db.collection("products").doc(id).delete();
    }
}
</script>
</body>
</html>

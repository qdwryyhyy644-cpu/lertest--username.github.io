<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عطور الفخامة</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs for Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <header>
        <h1>عطور الفخامة</h1>
        <div class="delivery-badge">🚚 التوصيل متوفر 58 ولاية</div>
        <button id="open-cart" onclick="toggleCart()">
            🛒 السلة (<span id="cart-count">0</span>)
        </button>
    </header>

    <div class="categories-bar">
        <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('عطور صيفية', this)">عطور صيفية</button>
        <button class="cat-btn" onclick="filterCategory('عطور رجالية', this)">عطور رجالية</button>
        <button class="cat-btn" onclick="filterCategory('عطور نسائية', this)">عطور نسائية</button>

        <button class="cat-btn" onclick="filterCategory('عطور للمناسبات', this)">عطور للمناسبات</button>
        <button class="cat-btn" onclick="filterCategory('الأكثر مبيعاً', this)">الأكثر مبيعاً</button>
    </div>

    <main class="products-grid" id="products-container">
        <p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding:40px;">جاري تحميل العطور...</p>
    </main>

    <!-- سلة المشتريات -->
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3>🛍️ سلة المشتريات</h3>
            <button onclick="toggleCart()" class="close-btn">✕</button>
        </div>
        
        <div class="cart-items" id="cart-items-list"></div>

        <div class="cart-footer">
            <div class="total-row">
                <span>الإجمالي:</span>
                <span id="cart-total" class="gold-text">0 د.ج</span>
            </div>
            <button class="whatsapp-submit" onclick="openCheckoutModal()">تأكيد الطلب 🛒</button>
        </div>
    </div>

    <!-- نافذة إدخال معلومات الزبون (Modal) -->
    <div id="checkout-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📋 معلومات الشحن</h3>
                <button onclick="closeCheckoutModal()" class="close-btn">✕</button>
            </div>
            <form id="order-form" onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" id="cust-name" required placeholder="أدخل اسمك الكامل">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="tel" id="cust-phone" required placeholder="06XXXXXXXX">
                </div>
                <div class="form-group">
                    <label>الولاية:</label>
                    <input type="text" id="cust-state" required placeholder="مثال: الجزائر، وهران...">
                </div>
                <div class="form-group">
                    <label>العنوان أو البلدية:</label>
                    <input type="text" id="cust-address" required placeholder="أدخل بلدية الإقامة أو العنوان">
                </div>
                <button type="submit" class="btn-submit-order">تأكيد وتوجيه للواتساب 📲</button>
            </form>
        </div>
    </div>

    <!-- شعار إرسال الطلب بنجاح -->
    <div id="success-toast" style="display:none;">
        ✅ تم إرسال طلبك بنجاح وسيتم التواصل معك قريباً!
    </div>

    <script src="script.js"></script>
</body>
</html>

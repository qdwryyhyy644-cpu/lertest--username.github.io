<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عطور الفخامة</title>
    <link rel="stylesheet" href="style.css">
    <!-- مكتبات Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <header>
        <h1>عطور الفخامة</h1>
        <div class="delivery-badge">🚚 التوصيل متوفر 58 ولاية</div>
        <!-- زر فتح السلة المحدث مع حدث onclick الصريح -->
        <button id="open-cart" onclick="toggleCart()" style="position: absolute; left: 15px; top: 20px; background: #d4af37; color: #121212; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">
            السلة (<span id="cart-count">0</span>)
        </button>
    </header>

    <!-- شريط التصنيفات -->
    <div class="categories-bar">
        <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('عطور صيفية', this)">عطور صيفية</button>
        <button class="cat-btn" onclick="filterCategory('عطور رجالية', this)">عطور رجالية</button>
        <button class="cat-btn" onclick="filterCategory('عطور نسائية', this)">عطور نسائية</button>
        <button class="cat-btn" onclick="filterCategory('عطور للمناسبات', this)">عطور للمناسبات</button>
        <button class="cat-btn" onclick="filterCategory('الأكثر مبيعاً', this)">الأكثر مبيعاً</button>
    </div>

    <!-- معرض المنتجات -->
    <main class="products-grid" id="products-container">
        <p style="text-align:center; grid-column:1/-1; color:#94a3b8; padding:40px;">جاري تحميل العطور...</p>
    </main>

    <!-- سلة المشتريات (Drawer) -->
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3>سلة المشتريات</h3>
            <button onclick="toggleCart()" style="background:none; border:none; color:#d4af37; font-size:1.5rem; cursor:pointer;">✕</button>
        </div>
        
        <div class="cart-items" id="cart-items-list">
            <!-- سيتم إضافة عناصر السلة هنا تلقائياً -->
        </div>

        <div class="cart-footer">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-size:1.1rem; font-weight:bold;">
                <span>الإجمالي:</span>
                <span id="cart-total" class="gold-text">0 د.ج</span>
            </div>
            <button class="whatsapp-submit" onclick="sendOrderWhatsApp()">تأكيد الطلب عبر واتساب</button>
        </div>
    </div>

    <!-- استدعاء ملف السكريبت الخارجي -->
    <script src="script.js"></script>
</body>
</html>
